# ms-authz — docker-compose fragment
#
# This is NOT run from here. It documents the service block that estudio-contable-infra's
# docker-compose.yml would add once ms-authz is wired into a system's local stack
# (MS-AUTHZ-SPEC.md §6, §12 step 3) — this repo does not touch other repos, so nothing here is
# applied automatically. Copy the `ms-authz` service below into the target compose file, next to
# `openfga` and `openfga-migrate`, which infra already has. ms-authz creates its OpenFGA store and
# writes the authorization model itself on startup, so there is no bootstrap step to run.
#
# Build context is this repo's root (ms-authz/), not this docker/ directory — see the comment at
# the top of src/MsAuthz.Api/Dockerfile.

services:
  ms-authz:
    build:
      context: ../ms-authz   # path relative to the infra repo; adjust to the real checkout location
      dockerfile: src/MsAuthz.Api/Dockerfile
    environment:
      Catalog__Path: "/app/catalog.json"
      OpenFga__ApiUrl: "http://openfga:8080"          # container-internal port — openfga's HTTP default, not the host-remapped 8082
      OpenFga__StoreName: "${MS_AUTHZ_STORE_NAME:-ms-authz}"
      Security__ApiKey: "${MS_AUTHZ_API_KEY}"
    depends_on:
      openfga:
        condition: service_started
    volumes:
      # The catalog file belongs to the consuming system, not to ms-authz — it is not baked into
      # the image. Point this at wherever that system keeps its own roles/permissions catalog.
      - ./ms-authz/catalog.json:/app/catalog.json:ro
    ports:
      # dev convenience only — see README's security boundary. In qa/staging/prod this MUST NOT be
      # published: ms-authz trusts its caller completely (no JWT validation), so it can only ever be
      # reachable from inside the compose network.
      - "6010:6010"
    restart: unless-stopped
