name: ms-authz — modelo de asignaciones
model_file: model.fga
tuples:
  - user: user:jurol|u-vendedor
    relation: assignee
    object: role:jurol|vendedor
  - user: user:jurol|u-vendedor-stock
    relation: assignee
    object: role:jurol|vendedor
  - user: user:jurol|u-vendedor-stock
    relation: assignee
    object: role:jurol|stock
  # La misma persona con rol en dos tenants son DOS objetos user distintos.
  - user: user:otraempresa|u-vendedor
    relation: assignee
    object: role:otraempresa|admin

tests:
  - name: "Asignacion directa"
    check:
      - user: user:jurol|u-vendedor
        object: role:jurol|vendedor
        assertions:
          assignee: true
      - user: user:jurol|u-vendedor
        object: role:jurol|stock
        assertions:
          assignee: false

  - name: "Aislamiento entre tenants: el user lleva tenant, asi que no hay forma de cruzar"
    check:
      - user: user:jurol|u-vendedor
        object: role:otraempresa|admin
        assertions:
          assignee: false
      - user: user:otraempresa|u-vendedor
        object: role:jurol|vendedor
        assertions:
          assignee: false

  - name: "Read de los roles de un user devuelve solo los de su tenant"
    list_objects:
      - user: user:jurol|u-vendedor-stock
        type: role
        assertions:
          assignee:
            - role:jurol|vendedor
            - role:jurol|stock
      - user: user:otraempresa|u-vendedor
        type: role
        assertions:
          assignee:
            - role:otraempresa|admin
